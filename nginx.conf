# Invitación estática — Nginx (Alpine)
# Raíz del sitio: /usr/share/nginx/html

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # Compresión (HTML/CSS/JS y SVG)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Página principal: evitar caché agresivo al actualizar textos
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sitio de una sola página: sirve archivos reales y cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché ligera en assets estáticos
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot|mp3|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # No servir dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
